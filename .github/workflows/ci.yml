name: YRewards CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: yrewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d yrewards_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      PGPASSWORD: test_password_only
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: yrewards_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bootstrap minimal Supabase test schemas
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
      - name: Apply YRewards migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611080001_initial.sql
      - name: Apply YRewards security, account and research migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611080002_security_hardening.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611080003_admin_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611090001_research_club_experience.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611090002_member_club_onboarding.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611090003_academy_courses.sql
      - name: Verify schedule, one-time credit and 24-hour unlock
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/assertions.sql
      - name: Verify five-video research, sequence, ledger and club
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/experience_assertions.sql
      - name: Verify course hierarchy, unlimited ordering and retained progress
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/academy_assertions.sql
